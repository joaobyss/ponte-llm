[project]
name = "ponte-llm"
version = "0.1.0"
description = "Servidores MCP que deixam o Claude (ou outro agente) delegar tarefas a um LLM local e ao Gemini (via Antigravity CLI)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "João Bernardes" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]
keywords = ["mcp", "llm", "llama.cpp", "ollama", "lm-studio", "gemini", "claude", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/joaobyss/ponte-llm"
Issues = "https://github.com/joaobyss/ponte-llm/issues"

[project.scripts]
ponte-local = "ponte_llm.local:main"
ponte-gemini = "ponte_llm.gemini:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
